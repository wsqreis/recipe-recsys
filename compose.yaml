# CPU:  docker compose run --rm recsys evaluate --stage test
# GPU:  docker compose run --rm recsys-gpu evaluate --stage test --models two_tower
services:
  recsys:
    build:
      context: .
      args:
        TORCH: cpu
    image: recipe-recsys:cpu
    # Write data/ and reports/ as the host user, not root.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    # `recsys search` talks to Ollama running on the host.
    environment:
      RECSYS_OLLAMA_URL: ${RECSYS_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Web app + API on http://localhost:8000 (`docker compose up app`).
  app:
    extends: recsys
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"

  recsys-gpu:
    extends: recsys
    build:
      args:
        TORCH: cuda
    image: recipe-recsys:cuda
    profiles: [gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
